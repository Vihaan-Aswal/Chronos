[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --disable-warnings
markers =
    unit: Fast in-memory unit tests
    contract: Contract and schema invariant tests
    privacy: Privacy redaction and data protection tests
    security: Negative and security authorization tests
    integration: Live external integration tests (opt-in only)
